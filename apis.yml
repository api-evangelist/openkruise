aid: openkruise
name: OpenKruise
description: >-
  OpenKruise is a CNCF incubating project providing advanced workload
  management and deployment automation for Kubernetes. It extends Kubernetes
  with enhanced controllers including CloneSet for efficient stateless
  updates, Advanced StatefulSet with in-place updates, SidecarSet for
  sidecar container management, BroadcastJob for node-level tasks, and
  ImagePullJob for pre-pulling container images.
url: https://openkruise.io
image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
- Workload Management
- Deployment
- Kubernetes
- Controllers
- Cloud Native
- Incubating
