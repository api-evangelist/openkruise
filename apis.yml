modified: '2026-03-16'
specificationVersion: '0.19'
type: Index
apis:
- aid: openkruise:openkruise-api
  name: OpenKruise Workload API
  description: >-
    OpenKruise provides Kubernetes CRDs for advanced workload management.
    CloneSet offers efficient rolling updates with partition control,
    Advanced StatefulSet supports in-place container updates, SidecarSet
    manages sidecar containers across pods, BroadcastJob runs tasks on
    all nodes, and ImagePullJob pre-pulls images. Each controller extends
    standard Kubernetes capabilities with fine-grained deployment control.
  humanURL: https://openkruise.io/docs/
